name: manger_plus
description: "Manger Plus — learning center: admin & teacher console on desktop, student & parent apps on phone and tablet."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── Firebase ───────────────────────────────────────────────────────────────
  # Run `flutterfire configure --out=lib/firebase/prod/firebase_options.dart`
  # before the first launch (see SETUP.md). Same versions wash_application
  # resolved on this machine.
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  # Videos, PDFs and images the teacher uploads live in Cloud Storage.
  firebase_storage: ^12.4.10

  # ── State & DI ─────────────────────────────────────────────────────────────
  # Same pair as wash_application: Cubit per feature, GetX for app-wide
  # theme / locale singletons.
  flutter_bloc: ^9.1.1
  get: ^4.7.3
  get_storage: ^2.1.1

  # ── Functional return types ────────────────────────────────────────────────
  dartz: ^0.10.1

  # ── UI ─────────────────────────────────────────────────────────────────────
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  flutter_switch: ^0.3.2
  fl_chart: ^0.69.2
  lottie: ^3.5.1
  intl: ^0.20.2
  flex_color_picker: ^3.8.0

  # ── Content ────────────────────────────────────────────────────────────────
  file_picker: ^8.1.2                # teacher picks a video / pdf / image
  video_player: ^2.9.2               # student plays lesson videos
  syncfusion_flutter_pdfviewer: ">=27.1.48 <32.0.0"   # student reads PDFs in-app
  url_launcher: ^6.3.1               # "open externally" fallback

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # `flutter gen-l10n` on every pub get / build — class `S` in lib/generated.
  generate: true

  # Copied from wash_application. A directory entry is NOT recursive, so
  # nested folders are listed one by one.
  assets:
    - assets/icons_assets/crm_icons_assets/
    - assets/icons_assets/form_builder_assets/
    - assets/icons_assets/home_assets/
    - assets/icons_assets/hr_assets/
    - assets/icons_assets/hr_assets/employee_details/
    - assets/icons_assets/main_icons_assets/
    - assets/icons_assets/messaging_assets/
    - assets/icons_assets/onboarding_assets/
    - assets/icons_assets/calendar_assets/
    - assets/icons_assets/roles_assets/
    - assets/icons_assets/services_assets/
    - assets/icons_assets/settings_assets/
    - assets/lottie_assets/home_lottie_assets/
    - assets/lottie_assets/main_lottie_assets/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/fonts_english/Cairo/Cairo-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/fonts_english/Cairo/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/fonts_english/Cairo/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/fonts_english/Cairo/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/fonts_english/Cairo/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/fonts_english/Cairo/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/fonts_english/Cairo/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/fonts_english/Cairo/Cairo-Black.ttf
          weight: 900
    - family: Tajawal
      fonts:
        - asset: assets/fonts/fonts_english/Tajawal/Tajawal-Light.ttf
          weight: 300
        - asset: assets/fonts/fonts_english/Tajawal/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/fonts_english/Tajawal/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/fonts_english/Tajawal/Tajawal-Bold.ttf
          weight: 700
    - family: Almarai
      fonts:
        - asset: assets/fonts/fonts_arabic/Almarai/Almarai-Light.ttf
          weight: 300
        - asset: assets/fonts/fonts_arabic/Almarai/Almarai-Regular.ttf
          weight: 400
        - asset: assets/fonts/fonts_arabic/Almarai/Almarai-Bold.ttf
          weight: 700

# App icon for every platform. Regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/app_icon/app_icon.png"
  android: true
  adaptive_icon_background: "#6C63FF"
  adaptive_icon_foreground: "assets/app_icon/app_icon_foreground.png"
  min_sdk_android: 23
  ios: true
  remove_alpha_ios: true
  # macOS icons are hand-made (rounded, with Apple's margin) — don't overwrite.
  macos:
    generate: false
  web:
    generate: true
    image_path: "assets/app_icon/app_icon.png"
    background_color: "#6C63FF"
    theme_color: "#6C63FF"
  windows:
    generate: true
    image_path: "assets/app_icon/app_icon.png"
    icon_size: 256
